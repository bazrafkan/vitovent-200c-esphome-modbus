<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Vitovent 200-C – LB1 panel ↔ RS485 ↔ XIAO ESP32-S3 wiring</text>

  <!-- LB1 -->
  <rect x="30" y="60" width="200" height="250" rx="8" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="130" y="82" text-anchor="middle" font-weight="bold" fill="#222">LB1 wall panel</text>
  <text x="130" y="98" text-anchor="middle" font-size="11" fill="#555">terminal block (back side)</text>
  <g fill="#222">
    <circle cx="230" cy="130" r="6" fill="#8B4513"/><text x="45" y="134">1  brown   +25 V DC</text>
    <circle cx="230" cy="180" r="6" fill="#ffffff" stroke="#555"/><text x="45" y="184">2  white   0 V (−)</text>
    <circle cx="230" cy="230" r="6" fill="#e6c200"/><text x="45" y="234">3  yellow  Modbus</text>
    <circle cx="230" cy="280" r="6" fill="#2e9e3e"/><text x="45" y="284">4  green   Modbus</text>
  </g>
  <path d="M30 150 H10 V350" fill="none" stroke="#666" stroke-width="6"/>
  <text x="15" y="372" font-size="11" fill="#555">existing 4-wire cable to the unit</text>
  <text x="15" y="387" font-size="11" fill="#555">(J4 power = 1-2, J9 Modbus = 3-4)</text>
  <text x="15" y="402" font-size="11" fill="#555">leave connected; add the new</text>
  <text x="15" y="417" font-size="11" fill="#555">wires in parallel on the same screws</text>

  <!-- LM2596 -->
  <rect x="330" y="60" width="170" height="120" rx="8" fill="#e8f0ff" stroke="#335" stroke-width="2"/>
  <text x="415" y="82" text-anchor="middle" font-weight="bold" fill="#222">LM2596 DC-DC</text>
  <text x="415" y="98" text-anchor="middle" font-size="11" fill="#555">buck, set to 5.0 V first!</text>
  <text x="340" y="129" fill="#222">IN+</text><text x="340" y="164" fill="#222">IN−</text>
  <text x="455" y="129" fill="#222">OUT+</text><text x="455" y="164" fill="#222">OUT−</text>

  <!-- Waveshare -->
  <rect x="330" y="250" width="170" height="210" rx="8" fill="#eaf7ea" stroke="#353" stroke-width="2"/>
  <text x="415" y="272" text-anchor="middle" font-weight="bold" fill="#222">Waveshare</text>
  <text x="415" y="288" text-anchor="middle" font-weight="bold" fill="#222">TTL TO RS485 (C)</text>
  <text x="415" y="303" text-anchor="middle" font-size="11" fill="#555">isolated · 120R = NC (off)</text>
  <text x="340" y="334" fill="#222">A+</text><text x="340" y="374" fill="#222">B−</text><text x="340" y="414" fill="#999">PE  (n.c.)</text>
  <text x="458" y="334" fill="#222">VCC</text><text x="458" y="374" fill="#222">GND</text><text x="458" y="414" fill="#222">TXD</text><text x="458" y="449" fill="#222">RXD</text>

  <!-- XIAO -->
  <rect x="700" y="60" width="230" height="400" rx="8" fill="#fff4e6" stroke="#533" stroke-width="2"/>
  <text x="815" y="82" text-anchor="middle" font-weight="bold" fill="#222">Seeed XIAO ESP32-S3</text>
  <text x="815" y="98" text-anchor="middle" font-size="11" fill="#555">no USB power when on DC-DC</text>
  <text x="712" y="129" fill="#222">5V (VUSB)</text><text x="712" y="164" fill="#222">GND</text>
  <text x="712" y="334" fill="#222">3V3</text>
  <text x="712" y="414" fill="#222">D7 / GPIO44  (UART RX)</text>
  <text x="712" y="449" fill="#222">D6 / GPIO43  (UART TX)</text>

  <!-- wires: power -->
  <path d="M230 130 H285 V125 H330" fill="none" stroke="#8B4513" stroke-width="4"/>
  <path d="M230 180 H295 V160 H330" fill="none" stroke="#555" stroke-width="6"/>
  <path d="M230 180 H295 V160 H330" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M500 125 H700" fill="none" stroke="#d62728" stroke-width="4"/>
  <text x="600" y="117" text-anchor="middle" font-size="11" fill="#d62728">+5.0 V</text>
  <path d="M500 160 H700" fill="none" stroke="#111" stroke-width="4"/>

  <!-- wires: bus (note the swap) -->
  <path d="M230 230 H310 V370 H330" fill="none" stroke="#e6c200" stroke-width="4"/>
  <path d="M230 280 H290 V330 H330" fill="none" stroke="#2e9e3e" stroke-width="4"/>
  <text x="250" y="470" font-size="11" fill="#b00">green (4) → A+, yellow (3) → B−</text>
  <text x="250" y="485" font-size="11" fill="#b00">(swap them if you only get garbage)</text>

  <!-- wires: TTL -->
  <path d="M500 330 H700" fill="none" stroke="#ff7f0e" stroke-width="4"/>
  <path d="M500 370 H600 V339 A9 9 0 0 1 600 321 V160" fill="none" stroke="#111" stroke-width="4"/>
  <circle cx="600" cy="160" r="5" fill="#111"/>
  <path d="M500 410 H700" fill="none" stroke="#1f77b4" stroke-width="4"/>
  <path d="M500 445 H700" fill="none" stroke="#9467bd" stroke-width="4"/>
  <text x="600" y="402" text-anchor="middle" font-size="11" fill="#1f77b4">TXD → RX</text>
  <text x="600" y="437" text-anchor="middle" font-size="11" fill="#9467bd">RXD ← TX</text>

  <text x="30" y="530" font-size="12" fill="#333">• Measure first: 1-2 must read ~25 V DC (power), 3-4 ~0 V between them (idle RS485). Never connect the bus module to 1-2.</text>
  <text x="30" y="550" font-size="12" fill="#333">• The LM2596 has no reverse-polarity protection: check + / − with a multimeter and trim the output to 5.0 V before connecting the XIAO.</text>
  <text x="30" y="570" font-size="12" fill="#333">• Alternative: skip the LM2596 and power the XIAO from a USB-C 5 V phone charger. Never use USB and the DC-DC at the same time.</text>
</svg>
