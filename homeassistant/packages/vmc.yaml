# Home Assistant package for the Vitovent 200-C ESPHome integration.
# Enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# then copy this file to <config>/packages/vmc.yaml.
# No 'initial' values on purpose: HA restores the last value set from the dashboard.
# Defaults used here: start 200 W, stop 50 W, delay 5 min, boost speed 4, morning boost 08:00-09:00.
# Alternatively create the same helpers from the UI (Settings > Devices & services > Helpers).

input_number:
  vmc_cooking_start_threshold:
    name: VMC Cooking Start Threshold
    min: 0.0
    max: 3000.0
    step: 10.0
    unit_of_measurement: W
    icon: mdi:stove
    mode: box
  vmc_cooking_stop_threshold:
    name: VMC Cooking Stop Threshold
    min: 0.0
    max: 1000.0
    step: 5.0
    unit_of_measurement: W
    mode: box
  vmc_cooking_stop_delay:
    name: VMC Cooking Stop Delay
    min: 1.0
    max: 60.0
    step: 1.0
    unit_of_measurement: min
    mode: box
  vmc_morning_boost_speed:
    name: VMC morning boost speed
    min: 1.0
    max: 4.0
    step: 1.0
    mode: box
    icon: mdi:fan
  vmc_cooking_boost_speed:
    name: VMC cooking boost speed
    min: 1.0
    max: 4.0
    step: 1.0
    mode: box
    icon: mdi:fan
input_datetime:
  vmc_morning_boost_start:
    name: VMC morning boost start
    has_date: false
    has_time: true
    icon: mdi:clock-outline
  vmc_morning_boost_end:
    name: VMC morning boost end
    has_date: false
    has_time: true
    icon: mdi:clock-outline

# Same automations as homeassistant/automations/*.yaml
automation:
  - id: vmc_boost_while_cooking
    alias: VMC Boost While Cooking
    description: Induction hob on -> VMC at input_number.vmc_cooking_boost_speed; hob off for the stop delay -> restore previous
      VMC state.
    triggers:
    - trigger: numeric_state
      id: cooking_on
      entity_id: sensor.kitchen_induction_power
      above: input_number.vmc_cooking_start_threshold
    - trigger: numeric_state
      id: cooking_off
      entity_id: sensor.kitchen_induction_power
      below: input_number.vmc_cooking_stop_threshold
      for:
        minutes: '{{ states(''input_number.vmc_cooking_stop_delay'') | int(5) }}'
    conditions: []
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: cooking_on
        sequence:
        - if:
          - condition: template
            value_template: '{{ states.scene | selectattr(''entity_id'',''eq'',''scene.vmc_before_cooking'') | list | count
              == 0 and (is_state(''fan.vmc_ventilation'',''off'') or state_attr(''fan.vmc_ventilation'',''percentage'') | int(0)
              != (states(''input_number.vmc_cooking_boost_speed'')|int(4)) * 25) }}'
          then:
          - action: scene.create
            data:
              scene_id: vmc_before_cooking
              snapshot_entities:
              - fan.vmc_ventilation
        - action: fan.set_percentage
          target:
            entity_id: fan.vmc_ventilation
          data:
            percentage: '{{ (states(''input_number.vmc_cooking_boost_speed'')|int(4)) * 25 }}'
      - conditions:
        - condition: trigger
          id: cooking_off
        - condition: template
          value_template: '{{ states.scene | selectattr(''entity_id'',''eq'',''scene.vmc_before_cooking'') | list | count >
            0 }}'
        sequence:
        - action: scene.turn_on
          target:
            entity_id: scene.vmc_before_cooking
        - action: scene.delete
          target:
            entity_id: scene.vmc_before_cooking
    mode: restart
  - id: vmc_morning_boost
    alias: VMC Morning Boost
    description: 'Morning boost: from input_datetime.vmc_morning_boost_start to _end the VMC runs at input_number.vmc_morning_boost_speed,
      then the previous state is restored. Skips restore if the cooking boost is active (it restores itself).'
    triggers:
    - trigger: time
      at: input_datetime.vmc_morning_boost_start
      id: start
    - trigger: time
      at: input_datetime.vmc_morning_boost_end
      id: stop
    conditions: []
    actions:
    - choose:
      - conditions:
        - condition: trigger
          id: start
        sequence:
        - if:
          - condition: template
            value_template: '{{ is_state(''fan.vmc_ventilation'',''off'') or state_attr(''fan.vmc_ventilation'',''percentage'')
              | int(0) != (states(''input_number.vmc_morning_boost_speed'')|int(4)) * 25 }}'
          then:
          - action: scene.create
            data:
              scene_id: vmc_before_morning
              snapshot_entities:
              - fan.vmc_ventilation
        - action: fan.set_percentage
          target:
            entity_id: fan.vmc_ventilation
          data:
            percentage: '{{ (states(''input_number.vmc_morning_boost_speed'')|int(4)) * 25 }}'
      - conditions:
        - condition: trigger
          id: stop
        - condition: template
          value_template: '{{ states.scene | selectattr(''entity_id'',''eq'',''scene.vmc_before_morning'') | list | count >
            0 }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ states.scene | selectattr(''entity_id'',''eq'',''scene.vmc_before_cooking'') | list | count
              == 0 }}'
          then:
          - action: scene.turn_on
            target:
              entity_id: scene.vmc_before_morning
        - action: scene.delete
          target:
            entity_id: scene.vmc_before_morning
    mode: single
