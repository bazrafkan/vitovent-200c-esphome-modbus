id: vmc_boost_while_cooking
alias: VMC Boost While Cooking
description: Induction hob on -> VMC at input_number.vmc_cooking_boost_speed; hob off for the stop delay -> restore previous
  VMC state.
triggers:
- trigger: numeric_state
  id: cooking_on
  entity_id: sensor.kitchen_induction_power
  above: input_number.vmc_cooking_start_threshold
- trigger: numeric_state
  id: cooking_off
  entity_id: sensor.kitchen_induction_power
  below: input_number.vmc_cooking_stop_threshold
  for:
    minutes: '{{ states(''input_number.vmc_cooking_stop_delay'') | int(5) }}'
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: cooking_on
    sequence:
    - if:
      - condition: template
        value_template: '{{ states.scene | selectattr(''entity_id'',''eq'',''scene.vmc_before_cooking'') | list | count ==
          0 and (is_state(''fan.vmc_ventilation'',''off'') or state_attr(''fan.vmc_ventilation'',''percentage'') | int(0)
          != (states(''input_number.vmc_cooking_boost_speed'')|int(4)) * 25) }}'
      then:
      - action: scene.create
        data:
          scene_id: vmc_before_cooking
          snapshot_entities:
          - fan.vmc_ventilation
    - action: fan.set_percentage
      target:
        entity_id: fan.vmc_ventilation
      data:
        percentage: '{{ (states(''input_number.vmc_cooking_boost_speed'')|int(4)) * 25 }}'
  - conditions:
    - condition: trigger
      id: cooking_off
    - condition: template
      value_template: '{{ states.scene | selectattr(''entity_id'',''eq'',''scene.vmc_before_cooking'') | list | count > 0
        }}'
    sequence:
    - action: scene.turn_on
      target:
        entity_id: scene.vmc_before_cooking
    - action: scene.delete
      target:
        entity_id: scene.vmc_before_cooking
mode: restart
